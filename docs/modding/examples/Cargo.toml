[package]
name = "sunrise-modding-examples"
version = "0.0.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
publish = false
description = "The Rust the modding book includes, so it compiles with the mod API: a workspace of its own, checked in a staged copy, whose point catalog its point example listens at (tools/ci/staged_check.py)"

[lib]
name = "modding_examples"
path = "src/lib.rs"

[dependencies]
sunrise-mod-api = { path = "../../../crates/sunrise-mod-api" }
sunrise-mod-points = { path = "../../../crates/sunrise-mod-points" }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[workspace]
