why = "Vanilla 26.3 Hud.extractRenderState gates vanilla paint, and Hud.extractCrosshair and Hud.extractChat decide whether to paint their contents. NeoForge Hud.registerVanillaLayers and GuiLayerManager.add put those checks in the original bodies. GuiLayerManager.render and renderInner run every slot in order between its Pre and Post events, unless Pre vetoes the pass or slot. A replacement or insertion no longer disappears just because vanilla would not paint. Focused chat still draws from vanilla's ChatScreen.extractRenderState, separately from the HUD's background chat slot."
migrate = """
Keep your hook and registrar signatures. `gui_layer_pre` is now v3, `gui_layer_post` v4, `register_gui_layers` v5 and `render_gui_pre` v3. Keep the same layer IDs and calls to `register`, `replace_layer` and `wrap_layer`. Your callbacks can now run under F1, in third person for `minecraft:crosshair`, in spectator mode for `minecraft:selected_item_name`, and at other times when the original body would not paint. Inserted slots also run under F1. To keep mod paint hidden under F1, guard it with `host.hud_mode() == mod_api::HudMode::AllVisible` (in a wrapper, read `ctx.host().hud_mode()`); to keep a crosshair replacement first-person only, also check `host.camera_type().is_first_person()`. Apply the same gates to work in Pre or Post that should only run when your paint would. Keep `ctx.draw_previous()` to delegate with the previous body's own eligibility intact.

Return `Flow::Cancel` from `render_gui_pre` to skip the entire layer pass, including `minecraft:sleep_overlay`; returning it from `gui_layer_pre` still skips only that slot and its Post. `minecraft:chat` now dispatches in the HUD pass even when the chat screen is open, but a replacement controls only background chat. For paint on the focused chat screen itself, move the drawing to `screen_render_pre` or `screen_render_post` and check `event.screen.id == "chat"`.
"""
