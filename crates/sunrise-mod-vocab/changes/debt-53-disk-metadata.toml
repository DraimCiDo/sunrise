why = "Chunk disk callbacks can borrow the captured identity instead of cloning it. The identity and failure metadata stay in process; chunk attachments use the normal disk NBT path."
migrate = "Replace `ChunkDiskContextWire` with `ChunkDiskContext` (including `ChunkDiskContextWire::new(...)` with `ChunkDiskContext::new(...)`). Keep `let job = host.job();` and read its fields through the borrow; use `(*host.job()).clone()` only if you need to keep the entire identity after the callback. `ChunkDiskContext`, `ChunkDiskFailure`, `ChunkDiskKind` and `ChunkDiskPhase` are local values, not `Wire` types. If a typed payload used them, replace them with the fields you actually send, such as `job.world.get()` (`u64`), `job.pos` (`[i32; 2]`), `matches!(job.kind, ChunkDiskKind::Full)` (`bool`) or `matches!(job.phase, ChunkDiskPhase::Save)` (`bool`); send the refusal's `mod_id`, `key` or `reason` as strings. Keep using `event.data.get/set/remove` with a persistence codec. Rebuild against the current SDK for the load and save hooks."
