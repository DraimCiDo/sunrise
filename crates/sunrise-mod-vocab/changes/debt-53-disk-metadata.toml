why = "Chunk disk callbacks can borrow the captured identity instead of cloning it. The ordinary chunk writer follows vanilla SerializableChunkData.write, ChunkMap.save and NbtIo.StringFallbackDataOutput: the disk encoding includes names, compound terminators and mixed-list wrappers, and writes strings too long for modified UTF-8 as empty strings."
migrate = "Replace `ChunkDiskContextWire` with `ChunkDiskContext` (including `ChunkDiskContextWire::new(...)` with `ChunkDiskContext::new(...)`). Keep `let job = host.job();` and read its fields through the borrow; use `(*host.job()).clone()` only if you need to keep the entire identity after the callback. `ChunkDiskContext`, `ChunkDiskFailure`, `ChunkDiskKind` and `ChunkDiskPhase` are local values, not `Wire` types. If a typed payload used them, replace them with the fields you actually send, such as `job.world.get()` (`u64`), `job.pos` (`[i32; 2]`), `matches!(job.kind, ChunkDiskKind::Full)` (`bool`) or `matches!(job.phase, ChunkDiskPhase::Save)` (`bool`); send the refusal's `mod_id`, `key` or `reason` as strings. Keep using `event.data.get/set/remove` with a persistence codec. Produce valid disk NBT for the ordinary reader and writer; an overlong modified-UTF-8 string is written empty on disk, not retained verbatim. There are no separate attachment-specific value, container-depth or total-byte caps. Rebuild against the SDK to record the current load and save hook versions (now version 3; see the typed attachment migration)."
