why = "Chunk disk callbacks can borrow the captured identity instead of cloning it. The job now counts the actual uncompressed disk NBT, including names, compound terminators, mixed-list wrappers and unknown entries, and refuses data that cannot be written without truncation."
migrate = "Replace `ChunkDiskContextWire` with `ChunkDiskContext` (including `ChunkDiskContextWire::new(...)` with `ChunkDiskContext::new(...)`). Keep `let job = host.job();` and read its fields through the borrow; use `(*host.job()).clone()` only if you need to keep the entire identity after the callback. `ChunkDiskContext`, `ChunkDiskFailure`, `ChunkDiskKind` and `ChunkDiskPhase` are local values, not `Wire` types. If a typed payload used them, replace them with the fields you actually send, such as `job.world.get()` (`u64`), `job.pos` (`[i32; 2]`), `matches!(job.kind, ChunkDiskKind::Full)` (`bool`) or `matches!(job.phase, ChunkDiskPhase::Save)` (`bool`); send the refusal's `mod_id`, `key` or `reason` as strings. Keep using `event.data.get/set/remove` with a persistence codec. Produce valid disk NBT within the ordinary reader and writer limits, including the modified UTF-8 length limit for names and strings. There are no separate attachment-specific value, container-depth or total-byte caps. Rebuild against the SDK to record the current load and save hook versions (now version 3; see the typed attachment migration)."
