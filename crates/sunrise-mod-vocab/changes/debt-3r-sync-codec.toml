ids = [
    "type:AttachmentCodec",
    "type:AttachmentForm",
    "type:AttachmentForm.synced",
    "method:AttachmentStore::synced_raw",
]
why = "Decouple attachment network synchronization from disk persistence, matching NeoForge's AttachmentType.Builder (net.neoforged.neoforge.attachment.AttachmentType) where serializer and syncHandler are independent. AttachmentCodec is now Copy, AttachmentForm carries a separate synced: Option<Compound> payload, and AttachmentStore adds synced_raw, allowing synced-only attachments without a persistence codec and distinct disk and network encodings while keeping the persistence codec requirement only for copy_on_death."
migrate = '''
- Pass `.sync(sync_codec)` on `AttachmentDescriptor` independently of `.serialize(codec)` (you may reuse your persistence `AttachmentCodec`, which is now `Copy`, or supply a dedicated sync codec; omitting `.serialize` while supplying `.sync` syncs without saving to disk).
- Custom `AttachmentStore` implementations must add `fn synced_raw(&mut self, holder: Holder, namespace: &str, name: &str) -> Result<Option<Compound>, AttachmentError>`, and `AttachmentForm` literals must include `synced: Option<Compound>`.
'''
