why = "Decouple attachment network synchronization from disk persistence, matching NeoForge's AttachmentType.Builder (net.neoforged.neoforge.attachment.AttachmentType) where serializer and syncHandler are independent. AttachmentType now carries sync_codec: Option<AttachmentCodec<T>> instead of sync: bool, allowing synced-only attachments without a persistence codec and distinct disk and network encodings while keeping the persistence codec requirement only for copy_on_death."
migrate = '''
- Replace `sync: false` on `AttachmentType` literals with `sync_codec: None`.
- Replace `sync: true` on `AttachmentType` literals with `sync_codec: Some(sync_codec)` (you may reuse your persistence `AttachmentCodec`, which is now `Copy`, or supply a dedicated sync codec; `codec: None` with `sync_codec: Some(...)` syncs without saving to disk).
- Replace `key.sync` checks with `key.sync_codec.is_some()`.
- Custom `AttachmentStore` implementations must add `fn synced_raw(&mut self, holder: Holder, namespace: &str, name: &str) -> Result<Option<Compound>, AttachmentError>`, and `AttachmentForm` literals must include `synced: Option<Compound>`.
'''
