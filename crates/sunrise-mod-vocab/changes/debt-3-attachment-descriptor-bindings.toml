why = "Part state, queries, disk callbacks, render snapshots and storage handlers now use the key issued by the attachment owner. A stale key cannot access saved or captured data just because its name matches. Saved names, copy-on-death, sync at commit and holder residency rules are unchanged. A Part state declaration is local to registration and is no longer Copy or Wire."
migrate = """\
    Register `AttachmentDescriptor::new(id, default)` with `r.register_attachment_type(...)` and keep \
    the returned `AttachmentKey<T>`. Retain the same saved name, codec and policies. For a dependency's \
    attachment, obtain `r.attachment_key::<T>(id)` after the dependency registers it. Replace \
    `fn state_key(&self) -> &AttachmentType<Self::Data>` in the block entity or entity Part with \
    `fn state_key(&self) -> &AttachmentKey<Self::Data>` and return a borrow of the key field. \
    Pass `&key` to `read_state`, `edit_part_state`, and `PartStateDeclaration::of`; declaration code \
    that needs to keep a second copy uses `.clone()`, and does not serialize the declaration. The \
    registrar checks the declaration with `declaration.check(current_record)` (the matching in-flight \
    `Option<&RegisteredAttachment>`). Replace a match on `PartStateRefusal::Incompatible` with one on \
    `PartStateRefusal::StaleKey`; obtain the key in the current registration, not a previous one. \
    Pass `&key` instead of `&TYPE` to `host.query`, `host.query_mut`, `batch.query`, \
    `render_attachments.get`, `original.attachment(host, ...)`, and `ChunkDiskData::{get,set,remove}`. \
    Keep a key on the renderer or callback owner instead of reading a static descriptor. On \
    `AttachmentError::StaleKey` discard the old key; in disk callbacks the refusal poisons the job. \
    `row.set(host, value)` and `row.remove(host)` are unchanged; besides checking residency they now \
    refuse a stale issued key with `AttachmentRowError::Value(AttachmentError::StaleKey)`. \
    Replace `AttachedItems::new(&TYPE, ...)`, `AttachedFluids::new(&TYPE, ...)`, \
    `AttachedStacks::single(&TYPE, ...)`, and `AttachedEnergy::new(&TYPE, ...)` with the same calls \
    taking the issued key by value; use `key.clone()` if the provider keeps its own key.\
    """
