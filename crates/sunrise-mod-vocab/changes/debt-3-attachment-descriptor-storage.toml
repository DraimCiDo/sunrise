why = "An attachment's typed operations must use the default, codec and policy chosen by its owner. The raw storage descriptor and standalone declaration lookup are no longer mod APIs. The same issued keys also work in hooks that borrow only a level."
migrate = """\
    Replace your static `AttachmentType<T>` and name-only registration with \
    `let key = registrar.register_attachment_type(AttachmentDescriptor::new(id, default))?` in \
    `Hooks::register`. Keep the saved ID unchanged and move the codec and policies onto the \
    descriptor with `.serialize(codec)`, `.sync()` and `.copy_on_death()`. If you do not own the \
    ID, declare a dependency on its owner and obtain `registrar.attachment_key::<T>(id)?` after \
    the owner registers it. This typed lookup replaces `attachment_declarations().validate_attachment_type(...)`; \
    the owner, not the consumer, chooses whether it syncs. Keep the issued key on the current \
    mod or Part, not in a process-wide static. Replace `TYPE.get(host.attachments(), holder)` \
    and the corresponding `has`, `get_existing`, `set`, `remove` and `sync_data` calls with \
    the corresponding calls on `key`, passing `host` itself. In a hook with a `LevelRandomHost`, \
    use `key.get_in(level, holder)`, `key.has_in(level, holder)`, `key.get_existing_in(level, holder)`, \
    `key.set_in(level, holder, value)`, `key.remove_in(level, holder)` or `key.sync_data_in(level, holder)`.\
    """
