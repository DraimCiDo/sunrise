why = "Follows vanilla 26.3 InsideBlockEffectApplier.StepBasedCollector, InsideBlockEffectType, Entity.checkInsideBlocks, PowderSnowBlock, LayeredCauldronBlock, and BaseFireBlock (NeoForge adds no event or extension for Block.entityInside). Replaces encoded deferred write enums (EntityWrite, InsideWrite), PlannedInside, and the HurtSourceError::Taken / EntityLookup / touched-block state-unchanged / sibling-write rejection machinery with owned run_before and run_after callbacks lent &mut InsideEntityView<'_> during applyAndClear. Entity mutations, source lookups, and level writes run directly against the live level while the entity remains alive, with per-callback panic containment (covering both invocation and dropping unexecuted captures) disabling only the panicking mod's entity_inside callback for the session and reporting a loud log and error toast."
migrate = '''
Replace encoded writes in `BlockPart::entity_inside` with owned closures on `event.run_before` / `event.run_after` that act on `&mut InsideEntityView<'_>`:
- `event.run_before(InsideEffect::Freeze, EntityWrite::Push(delta))` -> `event.run_before(InsideEffect::Freeze, move |view| { view.push(delta); })`
- `event.run_after(InsideEffect::Freeze, EntityWrite::SetMovement(vel))` -> `event.run_after(InsideEffect::Freeze, move |view| { view.set_velocity(vel); })`
- `event.run_after(InsideEffect::Freeze, EntityWrite::StuckIn(mul))` -> `event.run_after(InsideEffect::Freeze, move |view| { view.make_stuck_in_block(mul); })`
- `event.run_after(InsideEffect::Freeze, EntityWrite::ResetFallDistance)` -> `event.run_after(InsideEffect::Freeze, |view| { view.reset_fall_distance(); })`
- `event.run_after(InsideEffect::FireIgnite, EntityWrite::SetFireTicks(ticks))` -> `event.run_after(InsideEffect::FireIgnite, move |view| { view.set_remaining_fire_ticks(ticks); })`
- `event.run_after(InsideEffect::Freeze, EntityWrite::AddEffect { effect, duration, amplifier })` -> `event.run_after(InsideEffect::Freeze, move |view| { view.add_effect(effect, duration, amplifier); })`
- `event.run_after(InsideEffect::Freeze, EntityWrite::Hurt { source: None, amount })` -> `event.run_after(InsideEffect::Freeze, move |view| { view.hurt("minecraft:generic", amount); })` (choose the vanilla or registered damage-type ID you want, such as `"minecraft:cactus"` or `"minecraft:in_fire"`).
- `event.run_after(InsideEffect::Freeze, EntityWrite::Hurt { source: Some(_id), amount })` -> obtain a live `EntityRef` (for example from a handle your mod stored earlier or resolved before the sweep) and capture it in the closure: `event.run_after(InsideEffect::Freeze, move |view| { view.hurt_with_source("minecraft:generic", amount, Some(source_ref), Some(source_ref)); })`. `HurtSourceError` and `EntityLookup` are removed; stale or unresolvable handles simply cause `hurt_with_source` to return `false` without rolling back sibling writes.
- `event.request(InsideWrite::SetBlock(state))` -> pick the `InsideEffect` ordering slot explicitly (for example `InsideEffect::Extinguish` for vanilla powder-snow/cauldron timing, or `InsideEffect::Freeze`) and capture the block coordinates: `let pos = [event.pos.x, event.pos.y, event.pos.z]; event.run_before(InsideEffect::Extinguish, move |view| { view.set_block(pos, state); })`
- `event.request(InsideWrite::DestroyBlock { drop })` -> `let pos = [event.pos.x, event.pos.y, event.pos.z]; event.run_before(InsideEffect::Extinguish, move |view| { view.destroy_block(pos, drop); })`

Collector inspection and removed traits:
- `InsideEffects::take_planned` and `InsideEffects::absorb_step` (along with `PlannedInside`) are removed; queue effects via `apply` and callbacks via `run_before` / `run_after`, and test outcomes by flushing against a test `InsideEntityAccess` or live world instead of inspecting recorded commands.
- `InsideEffects` now holds owned closures (`Box<dyn FnOnce(&mut InsideEntityView<'_>) + 'static>`) and therefore no longer implements `Wire`, `Clone`, or `PartialEq`. Do not serialize, clone, or compare collectors; keep any data your mod wants to serialize or compare in your own value types and move owned data into each callback closure.
- Level writes apply directly to the live level without a touched-block state-unchanged gate or whole-batch rollback; check the `bool` return of `set_block` / `destroy_block` / `hurt` / `hurt_with_source` / `push` / `set_velocity` / `make_stuck_in_block` / `add_effect` directly inside the callback when needed. `event.apply(InsideEffect::...)` is unchanged.
'''
