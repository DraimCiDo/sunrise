why = "Related reads now resolve a handle once rather than reopening it for each getter. An unavailable handle never calls the reader; a resolved object can still lack individual fields. Borrowed data stays in the read, without holding a lock or residency guard while mod code runs. Writes still validate their own handles."
migrate = '''Keep the handle or return copied or owned values from the callback. Finish the read before writing or calling code that can reenter mods, then resolve again if you need fresh data. The outer `None` from `with_view` means the callback did not run. An optional getter's own `None` is separate; flatten once for the old single-getter shape when you do not need that distinction.

### Menu

Keep `player.container_menu(host)` and menu-window lookups. Move `menu.container_id(host)`, `kind(host)`, `slot_count(host)`, `slot(host, index)`, `carried(host)`, `slot_backing(host, index)`, `slot_holds(host, index, &stack)` and `slot_gives(host, index)` into one menu scope. The same getter names now live on the view and omit the host:

```rust,ignore
let menu_state = menu.with_view(host, |view| {
    let kind = view.kind().map(|kind| kind.map(str::to_owned));
    (view.container_id(), kind, view.slot_count(), view.slot(index),
     view.carried(), view.slot_backing(index), view.slot_holds(index, &stack),
     view.slot_gives(index))
});
```

`kind()` borrows a name; copy it only if you need it after the scope. `slot()` and `carried()` already return owned stacks. For a single slot use `menu.with_view(host, |view| view.slot(index)).flatten()` to recover the old `Option<Option<ItemStack>>`; do not flatten away `Some(None)` for an empty slot. The same one flatten recovers the old shape for the copied kind (`Some(None)` for inventory) and the other optional getters. Keep `cursor`, slot writes, click, close and data writes as handle operations.

Move `menu.slot_boxes(host)` and `menu.slot_kinds(host)` to `view.slot_boxes()` and `view.slot_kinds()` in a client scope:

```rust,ignore
let details = menu.with_client_view(host, |view| {
    Ok::<_, LevelReadError>((view.slot_boxes(), view.slot_kinds(), view.merchant_offers()?))
})?.transpose()?;
```

For the old Option-only geometry or role read, use `menu.with_client_view(host, |view| view.slot_boxes()).ok().flatten().flatten()` (or `view.slot_kinds()`). Replace a standalone `menu.merchant_offers(host)?` with `menu.with_client_view(host, |view| view.merchant_offers())?.transpose()?.flatten()`. The first outer `?` propagates a phase or backend refusal; the second propagates the view's merchant-read error. A stale menu does not run the callback, a non-merchant reports no offers, and a merchant with zero offers still yields `Some(Vec::new())`.

### Player

Move `player.game_mode(host)`, `is_creative(host)`, `is_spectator(host)`, `may_build(host)`, `abilities(host)`, `food(host)`, `needs_food(host)`, `has_enough_food(host)`, `can_eat(host, always)`, `experience(host)` and `xp_needed_for_next_level(host)` into one live player scope:

```rust,ignore
let player_state = player.with_view(host, |view| {
    (view.game_mode(), view.is_creative(), view.is_spectator(), view.may_build(),
     view.abilities(), view.food(), view.needs_food(), view.has_enough_food(),
     view.can_eat(always), view.experience(), view.xp_needed_for_next_level())
});
```

For one flag or XP getter, `player.with_view(host, |view| view.is_creative())` already returns the old `Option`. Flatten once for a single `game_mode`, `abilities`, `food`, `needs_food`, `has_enough_food` or `can_eat` read. The original player's separate experience read, pickup cooldown, inventory, offline settings and writes do not move.

### Entity

Move `entity.position(host)`, `block_position(host)`, `rotation(host)` and `kind(host)` into one entity scope:

```rust,ignore
let spatial = entity.with_view(host, |view| {
    (view.position(), view.block_position(), view.rotation(), view.kind())
});
```

An entity view can carry only part of this data. For a single field use `entity.with_view(host, |view| view.position()).flatten()` or substitute the field's getter. Rotation stays `[yaw, pitch]` in degrees and block coordinates still floor each component. Retain the copyable type key for comparisons; use `key.id(host)` if you need its name. UUIDs, level, riding, attachments and writes remain separate.

### Block entity

Move `block_entity.kind(host)`, `position(host)`, `level(host)` and `data_slots(host)` into one block entity scope:

```rust,ignore
let holder = block_entity.with_view(host, |view| {
    let first_slot = view.data_slots().map(|slots| slots.first().copied());
    (view.kind(), view.position(), view.level(), first_slot)
});
```

Return only the fields you need. To retain the old whole slot list, use `block_entity.with_view(host, |view| view.data_slots().map(<[i32]>::to_vec)).flatten()`; `Some(Vec::new())` is a mod block entity with no slots and `None` is no data or no scope. For one kind read, flatten once; position and level need no flatten. A block entity taken out for its tick does not lend a view but keeps its identity for Part state. Saved data, its lock and writes retain their own calls.

### Chunk

Move `chunk.loaded(host)`, `status(host)`, `is_slime_chunk(host)` and `sections_with_block(host, block)` into one server chunk scope:

```rust,ignore
let facts = chunk.with_view(host, |view| {
    (view.loaded(), view.status(), view.is_slime_chunk(), view.sections_with_block(block))
});
```

For an individual `loaded` read, `chunk.with_view(host, |view| view.loaded()).unwrap_or(false)` keeps the old bool. Flatten once for the old `status` or `sections_with_block` Option, but not for `is_slime_chunk`, which is a plain bool inside the scope. A valid unloaded chunk runs the callback: it cannot answer status or palette reads but still answers the seeded slime test. Stale or out-of-world handles and client hosts do not call the callback. Watchers, tickets, forced chunks and `resend` remain separate.'''
