why = "Related menu reads now use one resolved window instead of reopening the handle for each getter. A stale handle never lends the window that replaces it. Clients keep separate access to layout and synchronized merchant offers. Menu writes still resolve their own handle."
migrate = """Move `menu.container_id(host)`, `menu.kind(host)`, `menu.slot_count(host)`, `menu.slot(host, index)`, `menu.carried(host)`, `menu.slot_backing(host, index)`, `menu.slot_holds(host, index, &stack)`, and `menu.slot_gives(host, index)` into one `menu.with_view(host, |view| { ... })`. Invoke `view.container_id()`, `view.kind()`, `view.slot_count()`, `view.slot(index)`, `view.carried()`, `view.slot_backing(index)`, `view.slot_holds(index, &stack)` and `view.slot_gives(index)` without the host there. A single optional getter needs one `.flatten()` after `with_view` to combine its unavailable case with a stale or unavailable menu; do not flatten the inner empty stack. To retain the old owned kind, use `menu.with_view(host, |view| view.kind().map(|kind| kind.map(str::to_owned))).flatten()`. Copy any borrowed data in the closure and write only after it returns.
Replace `menu.slot_boxes(host)` and `menu.slot_kinds(host)` with `menu.with_client_view(host, |view| view.slot_boxes()).ok().flatten().flatten()` and `menu.with_client_view(host, |view| view.slot_kinds()).ok().flatten().flatten()` to keep the previous Option behavior. Instead of `menu.merchant_offers(host)?`, use `menu.with_client_view(host, |view| view.merchant_offers())?.transpose()?.flatten()` to propagate phase/backend and offer-projection refusals while retaining an empty merchant as `Some(vec![])`. `with_client_view` also inherits the shared `MenuView` reads; its outer `Ok(None)` means the menu did not resolve."""
