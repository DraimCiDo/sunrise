why = "NeoForge's Hud.registerVanillaLayers, VanillaGuiLayers and GuiLayerManager.add/render/renderInner give the five status rows separate slots and walk them even when the original bodies are hidden. Only an original vanilla body applies its own visibility rules. Pre cancellation skips the body, including side effects such as vanilla Hud.extractAirBubbles sounds. Vanilla Gui.extractRenderState extracts the HUD before screens, including in-world Options, and ChatScreen.extractRenderState paints focused chat separately from Hud.extractChat. Hud.extractSubtitleOverlay defers subtitle paint to Screen.extractBackground or the end of Gui.extractRenderState without reposting layer events. NeoForge's Hud.extractHealthLevel reserves its left-column height before extracting hearts, and Hud.extractArmorLevel uses that height. Sunrise uses its shared CallbackOwner reporting; mod callback errors remain visible under F1 so players can see which callback was disabled."
migrate = '''
The signatures do not change. `minecraft:player_health` now means player hearts only. To cancel several status slots in `gui_layer_pre`, match each relevant ID: `minecraft:player_health`, `minecraft:armor_level`, `minecraft:food_level`, `minecraft:vehicle_health` or `minecraft:air_level`. For a replacement that drew several rows, move each row's drawing into its own `event.layers.replace_layer(id, Box::new(draw))` call. To insert or observe after all the status rows, change `GuiLayerPlacement::Above("minecraft:player_health".into())` to `GuiLayerPlacement::Above("minecraft:air_level".into())`, or match `minecraft:air_level` instead of `minecraft:player_health` in `gui_layer_post`. A canceled slot or an original body that is skipped does not reserve column height.

In `Hooks::health_hud`, return `Some(heart_draws)` for paint-only replacement (including an empty vector to omit paint and keep the space), or `None` for vanilla paint. The original slot still reserves its vanilla height for armor. Move armor, food, vehicle and air draws to replacements for their own IDs. Both `health_hud` and `player_heart_type` run inside the original hearts body, so neither fires nor reserves space if the slot is canceled, replaced, or hidden. A wrapper that still wants those hooks and the height reservation calls `ctx.draw_previous()`.

Keep `event.layers.register(id, placement, Box::new(|host, draw| { /* paint */ }))` and `event.layers.replace_layer(id, Box::new(|host, draw| { /* paint */ }))`, but guard the paint with `host.hud_mode() == mod_api::HudMode::AllVisible` if it should be hidden under F1. A replacement no longer inherits any of the original slot's visibility conditions; apply the conditions your painter needs. Keep `event.layers.wrap_layer(id, Box::new(|ctx| { /* delegate and add paint */ }))`. Guard calls to `ctx.with_draw(...)` with `ctx.host().hud_mode() == mod_api::HudMode::AllVisible` if the wrapper's own paint should be hidden. Call `ctx.draw_previous()` wherever the previous body should run, even under F1: it applies its own conditions and does not fire separate layer events.

Layer Pre and Post and whole-HUD Pre and Post likewise run under F1, before open screens such as in-world Options. `minecraft:chat` is visited once in the HUD walk; a replacement, wrapper or veto there does not affect focused chat drawn by the chat screen. `minecraft:subtitle_overlay` is likewise dispatched once: if the original body defers its paint to an in-game screen, it can still paint there under F1 without running the layer hooks again. Cancel that slot or omit `ctx.draw_previous()` to skip the original subtitle paint. `Flow::Cancel` from a layer Pre now skips the entire installed body and Post, including body side effects such as the air-bubble sound. There is no paint-only veto: to keep that side effect, return `Flow::Continue` and leave the original body in place (or delegate to it with `ctx.draw_previous()`), accepting its paint. Return `Flow::Cancel` from `render_gui_pre` only if you want to skip all layer hooks and bodies and whole-HUD Post, not the open screen. Move a `render_gui_post` overlay that must remain below the status rows to a layer registered below `minecraft:player_health`. Keep `render_gui_post` for drawing above the HUD but below screens; use `gui_render_post` only for drawing above screens.
'''
