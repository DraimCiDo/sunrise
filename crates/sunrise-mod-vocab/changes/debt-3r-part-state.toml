why = "Part state uses issued AttachmentKey<T> handles instead of static AttachmentType<T> items. Because each attachment ID is registered once with one concrete Rust type during Hooks::register, incompatible Rust types on the same key are impossible at key issuance, and stale keys from prior installations are refused at registration (PartStateRefusal::StaleKey) and at runtime (AttachmentError::StaleKey). PartStateDeclaration drops Wire and Copy because it carries registration identity for the registrar's stale-key check."
migrate = '''
- Store the `AttachmentKey<Self::Data>` returned by `r.register_attachment_type(...)` (or `r.attachment_key::<Self::Data>(...)`) on your `BlockEntityPartState` or `EntityPartState` Part struct.
- Replace `const DATA: &'static AttachmentType<Self::Data>` with `fn state_key(&self) -> &AttachmentKey<Self::Data>`.
- Call `part.state(...)`, `part.state_existing(...)`, `part.state_in(...)`, `part.state_existing_in(...)`, and `part.edit_state(...)` on the Part instance (`&self`) instead of `Part::*`.
- Pass `&AttachmentKey<T>` to `read_state`, `edit_part_state`, and `PartStateDeclaration::of`.
- Replace matches on `PartStateRefusal::Incompatible { .. }` with `PartStateRefusal::StaleKey`.
'''
