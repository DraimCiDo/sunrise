ids = ["method:ItemStorage::visit_entries"]
why = "ItemStorage now distinguishes a caller-requested stop from exhaustion without reading any more entries. This keeps the sided traversal and short-circuit behavior of vanilla 26.3 HopperBlockEntity.suckInItems and NeoForge's ResourceHandlerUtil.extractFirst; neither exposes a by-kind visitor."
migrate = "ItemStorage::visit_entries(host, visitor) now returns Result<std::ops::ControlFlow<()>, StorageError> instead of Result<(), StorageError>. Match Ok(ControlFlow::Break(())) for a visitor-requested stop, Ok(ControlFlow::Continue(())) for exhaustion, and Err(error) for a failed read. If you only need to propagate a read error, use let _ = storage.visit_entries(host, visitor)?;. In a provider implementation, return Ok(flow) immediately when visitor(kind, amount) returns a Break and return Ok(ControlFlow::Continue(())) on exhaustion. The visitor's signature is unchanged."
