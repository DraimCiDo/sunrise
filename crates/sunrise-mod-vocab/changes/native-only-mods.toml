why = "Native and content-only packages are the supported mod routes. Remove guest runtime variants, transport snapshots, resource transfer and encoded record writeback. Part state and chunk disk access no longer require a transport codec. Dimension registration methods are now required without refusal defaults. The point catalog loses the removed worldgen adapter and records the new signature of the block-entity tick scope."
migrate = "Native authors do not need to republish unchanged uses.json tables. Schema 1 and 2 lists continue to fit unchanged methods and functions; new scans write schema 3. Native callers of PartStateDeclaration::check drop the boolean argument; native DimensionsRegistrar implementations supply both methods. Use attachment codecs for persistence and Wire for typed payloads and recipes, not the removed transport forms."
