why = "The Part instance supplies the attachment key at registration and in its hooks, so the key no longer has to be a type-wide static. Saved names, holder checks and transaction behavior are unchanged."
migrate = """\
    Replace `const DATA` on `BlockEntityPartState` or `EntityPartState` with \
    `fn state_key(&self) -> &AttachmentType<Self::Data>` returning a borrow of the Part's key field. \
    Initialize that field in the Part passed to `block_entity_part_with_state` or `entity_part_with_state`; \
    keep the same namespace and name. Replace `P::DATA` with `part.state_key()`. \
    Replace `P::state(host, entity)`, `P::state_existing(host, entity)`, and `P::edit_state(host, entity, edit)` \
    with `part.state(host, entity)`, `part.state_existing(host, entity)`, and `part.edit_state(host, entity, edit)` \
    (`self` in a Part hook). For block entities, replace `P::state_in(level, entity)` and \
    `P::state_existing_in(level, entity)` with `part.state_in(level, entity)` and \
    `part.state_existing_in(level, entity)`. `edit_part_state(host, entity, key, edit)` now accepts a \
    non-static key borrow; existing calls passing a static key still compile.\
    """
