why = "Register typed attachment descriptors once during Hooks::register and operate through the issued AttachmentKey<T> everywhere, retiring AttachmentType, AttachmentEntry, and the doc-hidden AttachmentDeclarations trait. Mirrors NeoForge's AttachmentType.Builder (net.neoforged.neoforge.attachment.AttachmentType), RegisterEvent.register for NeoForgeRegistries.Keys.ATTACHMENT_TYPES, ChunkDataEvent, PlayerEvent.Clone, ResourceStacksResourceHandler, and SimpleEnergyHandler. Client synchronization (.sync(sync_codec)) is decoupled from disk persistence (.serialize(codec)) via AttachmentCodec: Copy, AttachmentForm.synced, and AttachmentStore::synced_raw; only .copy_on_death() requires .serialize(codec). Disk envelopes store persistence NBT only, and both attachment-sync send routes project through the active registered descriptor's sync_codec. Any valid lowercase namespace:name not already registered is accepted regardless of registering package ID, while the registering package is recorded as owner on RegisteredAttachment and AttachmentKey for duplicate diagnostics and side = \"server\" synced-attachment admission. Issued keys carry active-installation identity so keys from prior installations are refused with AttachmentError::StaleKey (and PartStateRefusal::StaleKey at Part registration), making incompatible Rust types on the same ID impossible at key issuance. AttachmentBatch's Wire format also carries each row's payload kind (Saved vs Synced) so synced-only and dual-codec rows survive wire transfer."
migrate = '''
- Replace `static KEY: AttachmentType<T>` and `r.register_attachment_type("ns:name", sync)` with a single registration in `Hooks::register` (which returns `()`, so do not use `?`; the registrar records any registration refusal on the load even if you only bind the `Ok` branch):
  `if let Ok(key) = r.register_attachment_type(AttachmentDescriptor::new("ns:name", default)) { *self.key.write().unwrap() = Some(key); }`
  Chain `.serialize(codec)`, `.sync(sync_codec)` (independent of `.serialize`; `AttachmentCodec` is `Copy`), and `.copy_on_death()` (requires `.serialize`) as needed.
- To read or write another package's attachment, declare a dependency on its owner and call `if let Ok(key) = r.attachment_key::<T>("ns:name") { ... }` during `Hooks::register` (returning `AttachmentError::Undeclared` if missing or `AttachmentError::TypeMismatch` if the Rust type differs).
- Store the issued `AttachmentKey<T>` on your mod, hook listener, renderer, or Part (cloning is cheap) and pass `&key` to `key.{get,has,get_existing,set,remove,sync_data}(host, holder)` (or `*_in(level, holder)` on `LevelRandomHost`), `host.query(&key)`, `host.query_mut(&key)`, `AttachmentBatch::query(&key)`, `EntityRenderAttachments::get(&key)`, `ChunkDiskData::{get,set,remove}(&key, ...)`, `OriginalPlayerRef::attachment(host, &key)`, `AttachedStacks::{new,single}(&key, ...)`, `AttachedEnergy::new(&key, ...)`, `read_state`, `edit_part_state`, and `PartStateDeclaration::of`.
- `AttachmentType::with_decoded` was removed: read a single holder as an owned value with `key.get_existing(host, holder)` (or `key.get_existing_in(level, holder)`), or borrow values without cloning through `host.query(&key)` rows.
- `PartStateDeclaration` is no longer `Copy` or `Wire`: clone it or rebuild it with `PartStateDeclaration::of(&key)` instead of copying by value, and do not serialize it over `Wire`.
- On `BlockEntityPartState` and `EntityPartState`, replace `const DATA: &'static AttachmentType<Self::Data>` with `fn state_key(&self) -> &AttachmentKey<Self::Data>` and call `self.state(...)`, `self.state_existing(...)`, `self.state_in(...)`, `self.state_existing_in(...)`, and `self.edit_state(...)` on `&self`. Replace matches on `PartStateRefusal::Incompatible { .. }` with `PartStateRefusal::StaleKey`.
- Handle `AttachmentError::StaleKey` if a key or retained `AttachmentRowMut` can outlive a registration reinstall (and `ChunkDiskData` local failure reasons `"StaleKey"` / `"missing persistence codec"`, or `EntityRenderAttachments::get` returning `AttachmentError::InvalidSyncPolicy` for unsynced keys). `ChunkDiskData` operations invoke only the persistence codec and report failures locally without poisoning unrelated edits.
- Custom `AttachmentStore` implementations must add `fn synced_raw(&mut self, holder: Holder, namespace: &str, name: &str) -> Result<Option<Compound>, AttachmentError>`, `AttachmentForm` literals must include `synced: Option<Compound>`, and custom `AttachmentTypesRegistrar` implementations must implement `submit_attachment` and `lookup_attachment` in place of `register_attachment_type`.
'''
