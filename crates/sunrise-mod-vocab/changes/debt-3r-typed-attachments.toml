why = "Register typed attachment descriptors once during Hooks::register and operate through the issued AttachmentKey<T> everywhere, retiring AttachmentType, AttachmentEntry, and the doc-hidden AttachmentDeclarations trait. Mirrors NeoForge's AttachmentType.Builder (net.neoforged.neoforge.attachment.AttachmentType), RegisterEvent.register for NeoForgeRegistries.Keys.ATTACHMENT_TYPES, ChunkDataEvent, PlayerEvent.Clone, ResourceStacksResourceHandler, and SimpleEnergyHandler. Client synchronization (.sync(sync_codec)) is decoupled from disk persistence (.serialize(codec)) via AttachmentCodec: Copy, AttachmentForm.synced, and AttachmentStore::synced_raw; only .copy_on_death() requires .serialize(codec). Disk envelopes store persistence NBT only. As in NeoForge's AttachmentSync.syncInitialAttachments and syncUpdate at vanilla ServerEntity.sendPairingData and sendDirtyEntityData, only the send pass uses the registered sync codec. Player respawn follows vanilla ServerPlayer.restoreFrom and NeoForge AttachmentInternals.copyEntityAttachments: the installed descriptor decides whether saved data is copied. For NeoForge ChunkDataEvent.Load and Save at ChunkMap and vanilla SerializableChunkData.read/write, only the failing callback's edits are discarded on unwind; other edits reach the ordinary NBT reader/writer, and both hooks move to version 3. Any valid lowercase namespace:name not already registered is accepted regardless of registering package ID, while the registering package is recorded as owner on RegisteredAttachment and AttachmentKey for duplicate diagnostics and side = \"server\" synced-attachment admission. Issued keys carry active-installation identity so keys from prior installations are refused with AttachmentError::StaleKey (and PartStateRefusal::StaleKey at Part registration), making incompatible Rust types on the same ID impossible at key issuance. At vanilla EntityRenderer.createRenderState and NeoForge RenderStateExtensions.onUpdateEntityRenderState, render values belong to the capture, not a later live lookup. EntityRenderAttachments binds its shared, lazily decoded capture to its installation. AttachmentBatch's Wire format now distinguishes persistence envelopes from original client replica bytes without running a network serializer."
migrate = '''
- Replace `static KEY: AttachmentType<T>` and `r.register_attachment_type("ns:name", sync)` with a single registration in `Hooks::register` (which returns `()`, so do not use `?`; the registrar records any registration refusal on the load even if you only bind the `Ok` branch):
  `if let Ok(key) = r.register_attachment_type(AttachmentDescriptor::new("ns:name", default)) { *self.key.write().unwrap() = Some(key); }`
  Chain `.serialize(codec)`, `.sync(sync_codec)` (independent of `.serialize`; `AttachmentCodec` is `Copy`), and `.copy_on_death()` (requires `.serialize`) as needed.
- To read or write another package's attachment, declare a dependency on its owner and call `if let Ok(key) = r.attachment_key::<T>("ns:name") { ... }` during `Hooks::register` (returning `AttachmentError::Undeclared` if missing or `AttachmentError::TypeMismatch` if the Rust type differs).
- Store the issued `AttachmentKey<T>` on your mod, hook listener, renderer, or Part (cloning is cheap) and pass `&key` to `key.{get,has,get_existing,set,remove,sync_data}(host, holder)` (or `*_in(level, holder)` on `LevelRandomHost`), `host.query(&key)`, `host.query_mut(&key)`, `AttachmentBatch::query(&key)`, `EntityRenderAttachments::get(&key)`, `ChunkDiskData::{get,set,remove}(&key, ...)`, `OriginalPlayerRef::attachment(host, &key)`, `AttachedStacks::{new,single}(&key, ...)`, `AttachedEnergy::new(&key, ...)`, `read_state`, `edit_part_state`, and `PartStateDeclaration::of`.
- `AttachmentType::with_decoded` was removed: read a single holder as an owned value with `key.get_existing(host, holder)` (or `key.get_existing_in(level, holder)`), or borrow values without cloning through `host.query(&key)` rows.
- `PartStateDeclaration` is no longer `Copy` or `Wire`: clone it or rebuild it with `PartStateDeclaration::of(&key)` instead of copying by value, and do not serialize it over `Wire`.
- On `BlockEntityPartState` and `EntityPartState`, replace `const DATA: &'static AttachmentType<Self::Data>` with `fn state_key(&self) -> &AttachmentKey<Self::Data>` and call `self.state(...)`, `self.state_existing(...)`, `self.state_in(...)`, `self.state_existing_in(...)`, and `self.edit_state(...)` on `&self`. Replace matches on `PartStateRefusal::Incompatible { .. }` with `PartStateRefusal::StaleKey`.
- Handle `AttachmentError::StaleKey` if a key or retained `AttachmentRowMut` can outlive a registration reinstall. `EntityRenderAttachments::get` also refuses captures from another installation, even with a current key, and returns `AttachmentError::InvalidSyncPolicy` for unsynced keys. Take a fresh capture/key instead of carrying render data across a reinstall.
- `key.set(...)` can refuse persistence encoding but no longer calls the sync encoder. `key.sync_data(...)` queues the current value; encoding happens in the send pass and its refusals are logged. To retain an attachment through player death, opt in on its current descriptor with `.copy_on_death()`; the flag in old saves only applies to absent mods.
- Rebuild `chunk_data_load` and `chunk_data_save` listeners against hook version 3. Remove `data.transaction(...)`; use individual `data.get/set/remove` calls with `&key`, checking each `Result`. A refused operation changes no envelope; do not rely on `data.failure()` or on other edits being discarded. If you explicitly construct `ChunkDiskData`, check `ChunkDiskData::from_nbt(...)` and use `data.finish()` directly (it returns the accepted `Compound`, not a `Result`). A panic discards only that listener's edits, disables its callback for the session and does not cancel publication.
- In a custom `AttachmentStore`, make `saved(...)` return only undecoded disk NBT. Implement `fn synced_raw(&mut self, holder: Holder, namespace: &str, name: &str) -> Result<Option<Compound>, AttachmentError>` for undecoded client replica bytes. In `AttachmentForm` literals, set `synced: None` for local writes and saved promotions, and keep the original bytes in `synced: Some(bytes)` only when decoding a replica. Custom `AttachmentTypesRegistrar` implementations must implement `submit_attachment` and `lookup_attachment` in place of `register_attachment_type`.
- Rebuild both writers and readers of `AttachmentBatch` Wire payloads with the same SDK; discard old encoded batches rather than trying to read them with the new layout. Each row is now `(AttachmentWriteToken, u8, Vec<u8>)`: tag `0` is a persistence NBT envelope, tag `1` is a sync NBT envelope from a client replica, and the byte vector is the network-NBT compound. Native live server rows without a persistence encoding are still queryable in process but do not transfer over Wire.
'''
