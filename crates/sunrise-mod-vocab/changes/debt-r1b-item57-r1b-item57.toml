ids = [
    "hook:extract_block_screen_effect",
    "trait:BlockScreenEffectRenderer",
    "handle:ExtractBlockScreenEffectEvent::set_custom_renderer",
    "handle:ExtractBlockScreenEffectEvent::has_custom_renderer",
    "handle:ExtractBlockScreenEffectEvent::clear_custom_renderer",
]
why = """
Vanilla 26.3's LevelExtractor.extractPlayerState and ScreenEffectRenderer.submit split overlay extraction from drawing.
NeoForge's ExtractBlockScreenEffectEvent.getPlayerRenderState and setCustomRenderer let later listeners inspect or
replace a renderer for the same overlay; ScreenEffectRenderer.submit uses the final choice and does not require
static renderers. Sunrise now lets later listeners see and clear the selection and accepts an owned Arc, so a mod
can reuse a stateful renderer without a global or a per-frame allocation. The hook version moves from 3 to 4:
a later listener can now clear an earlier choice without changing overlay cancellation.
"""
migrate = """
Replace event.set_custom_renderer(&MY_RENDERER) with event.set_custom_renderer(self.renderer.clone()). Store
renderer: Arc<MyRenderer> (or Arc<dyn BlockScreenEffectRenderer>) in your Hooks implementation and create it once
before extraction. Renderer implementations must now be Send + Sync. If your renderer stores a thread-bound
lock guard, store the lock instead and take the guard inside submit. If you selected a renderer that draws nothing
and returns false just to undo an earlier listener's choice, use event.clear_custom_renderer() instead.
Use event.has_custom_renderer() to test the current
choice before replacing or clearing it. Clear does not change cancellation; with no renderer, a canceled overlay
still draws nothing. The submit signature and its return value are unchanged.
"""
