[package]
name = "sunrise-server-launch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Shared server configuration, installation layout and dedicated-engine commands"

[dependencies]
sunrise-platform = { path = "../sunrise-platform", features = ["server-files"] }
sunrise-core = { path = "../sunrise-core" }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false }
semver = { version = "1", features = ["serde"] }
url = "2"
dunce = "1.0.5"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[lints]
workspace = true
